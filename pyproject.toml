[project]
name = "grocery-app"
version = "0.1.0"
description = "Grocery receipt extraction, normalization, and purchase-history insights"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.4", "pillow>=10", "beautifulsoup4>=4.12"]

[project.scripts]
grocery-app = "grocery_app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
# The HTTP layer is optional so the pipeline CLI stays installable without it.
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Errors, pyflakes, import order, bugbear, modern syntax. Style beyond that is
# left to the reader; the point of CI is that a merge cannot break the code.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["grocery_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
