[project]
name = "grocery-app"
version = "0.1.0"
description = "Grocery receipt extraction, normalization, and purchase-history insights"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.4", "pillow>=10", "beautifulsoup4>=4.12"]

[project.scripts]
grocery-app = "grocery_app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]
