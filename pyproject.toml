[project]
name = "grocery-app"
version = "0.1.0"
description = "Portfolio scaffold for grocery receipt parsing, normalization, and a web demo"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
grocery-app = "grocery_app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
