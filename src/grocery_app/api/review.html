<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basket review</title>
<!--
  The shopper's page, served by `grocery-app serve` at `/`. It only reads,
  uploads and answers through the API (/v1/checks, /v1/questions,
  /v1/receipts, POST /v1/receipts + /v1/jobs, /v1/products, /v1/insights,
  PUT .../resolution): nothing here decides anything. Throwaway UI below the
  contract; the iOS app will do the same job against the same API.
-->
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f1; --card: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --accent-soft: #cde2fb;
    --good: #006300; --bad: #d03b3b; --warn: #b06a00;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --card: #1f1f1e; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.12);
      --accent: #3987e5; --accent-soft: #184f95;
      --good: #0ca30c; --bad: #e34948; --warn: #fab219;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --card: #1f1f1e; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.12);
    --accent: #3987e5; --accent-soft: #184f95;
    --good: #0ca30c; --bad: #e34948; --warn: #fab219;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45;
    -webkit-font-smoothing: antialiased; }
  .app { max-width: 480px; margin: 0 auto; padding: 0 16px 40px; }
  header { padding: 18px 0 6px; position: sticky; top: 0; z-index: 5;
    background: linear-gradient(var(--page) 80%, transparent); }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
  .sub { color: var(--ink2); font-size: 13px; }
  nav { display: flex; gap: 6px; margin-top: 10px; }
  nav button { flex: 1; padding: 9px 4px; font-size: 13px; }
  button { font: inherit; font-size: 14px; border-radius: 10px; padding: 9px 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer; }
  button.on, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.good { border-color: var(--good); color: var(--good); }
  button.bad { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: 0.5; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin: 12px 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .printed { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px;
    background: var(--page); border-radius: 8px; padding: 6px 8px; margin: 6px 0;
    overflow-wrap: anywhere; }
  .says { font-size: 15px; margin: 6px 0 10px; }
  .picture { display: flex; align-items: flex-end; gap: 10px; margin: 8px 0; text-decoration: none; }
  .picture img { width: 120px; height: 120px; object-fit: contain; border-radius: 10px;
    background: #fff; border: 1px solid var(--border); }
  .says b { font-weight: 650; }
  .why { color: var(--ink2); font-size: 13px; margin: 4px 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button { flex: 1 1 auto; }
  .list button { display: block; width: 100%; text-align: left; margin: 6px 0; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 6px;
    padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  .badge.you { background: var(--accent-soft); color: var(--ink); }
  .badge.app { border: 1px solid var(--warn); color: var(--warn); }
  .badge.none { border: 1px solid var(--bad); color: var(--bad); }
  .badge.guess { border: 1px dashed var(--muted); color: var(--muted); }
  .guess { color: var(--ink2); font-style: italic; }
  /* A receipt line slides left to show its one action, the iPhone way
     (Parham, 2026-10-08); Edit shows it on every line, for a computer. */
  .swipe { position: relative; overflow: hidden; border-top: 1px solid var(--grid); }
  .swipe > .line { position: relative; background: var(--card); border-top: 0;
    transition: transform 0.2s; touch-action: pan-y; }
  .swipe > .act { position: absolute; top: 0; right: 0; bottom: 0; width: 96px; border: 0;
    border-radius: 0; background: var(--bad); color: #fff; font-size: 13px; font-weight: 600; }
  .swipe.out > .act { background: var(--accent); }
  .swipe.open > .line { transform: translateX(-96px); }
  .editing .swipe { display: flex; align-items: center; gap: 8px; }
  .editing .swipe > .line { flex: 1; min-width: 0; }
  .editing .swipe > .act { position: static; order: 2; width: auto; border-radius: 8px;
    padding: 6px 10px; font-size: 12px; }
  .edit-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    margin: 4px 0 6px; }
  .edit-row button { font-size: 12px; padding: 4px 12px; }
  .line.off .what, .line.off .money { color: var(--muted); text-decoration: line-through; }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0;
    border-top: 1px solid var(--grid); cursor: pointer; }
  .line:first-of-type { border-top: 0; }
  .line .what { font-size: 14px; }
  .line .money { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 13px;
    white-space: nowrap; }
  input { font: inherit; font-size: 16px; width: 100%; padding: 9px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--page); color: var(--ink); margin: 6px 0; }
  .picker { margin-top: 10px; border-top: 1px solid var(--grid); padding-top: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .photo { display: block; text-align: center; padding: 18px 12px; border-radius: 12px;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .photo input { display: none; }
  .stat { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .months { display: flex; gap: 6px; overflow-x: auto; margin: 0 -2px 12px; padding: 0 2px; }
  .months button { flex: 0 0 auto; padding: 6px 12px; font-size: 13px; }
  .spend { margin-top: 10px; }
  .spend-row { cursor: pointer; padding-bottom: 6px; }
  .spend-row .line { padding-bottom: 4px; }
  .bar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .items { padding: 2px 0 8px 12px; border-left: 2px solid var(--grid); margin: 4px 0 8px; }
  .items .line { padding: 6px 0; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .up { color: var(--bad); } .down { color: var(--good); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 20px; max-width: 448px;
    margin: 0 auto; background: var(--ink); color: var(--page); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; display: none; align-items: center; gap: 12px; }
  .toast span { flex: 1; }
  .toast button.undo { background: none; border: 0; color: var(--page); font-weight: 600;
    padding: 4px 0; text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Basket review</h1>
    <div class="sub" id="stats">Loading…</div>
    <nav>
      <button id="tab-waiting" class="on">Waiting</button>
      <button id="tab-receipts">Receipts</button>
      <button id="tab-add">Add</button>
      <button id="tab-insights">Insights</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// All text from receipts and the model goes in with textContent, never as HTML.
const state = { tab: "waiting", checks: null, questions: null, receipts: null, open: null,
                insights: null, jobs: null, sending: [], notSent: [], uploaded: new Set() };
const TABS = ["waiting", "receipts", "add", "insights"];

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

// `undo`, when given, puts an Undo button in the message and keeps it up
// longer: a tap by accident is taken back where it happened (2026-10-08).
function toast(text, undo) {
  const box = document.getElementById("toast");
  box.replaceChildren(el("span", {}, text));
  if (undo) box.append(el("button", { class: "undo", onclick: () => {
    box.style.display = "none";
    undo();
  } }, "Undo"));
  box.style.display = "flex";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { box.style.display = "none"; }, undo ? 8000 : 3500);
}

// The server's password (GROCERY_TOKEN), typed once into the page and kept
// on this phone. A server without one never answers 401, so nothing is asked.
// A form, not prompt(): Safari and in-app browsers may never show a prompt.
function savedToken() {
  try { return localStorage.getItem("grocery-token") || ""; } catch (_) { return ""; }
}

async function api(path, options) {
  const opts = { ...(options || {}) };
  const token = savedToken();
  if (token) opts.headers = { ...(opts.headers || {}), Authorization: "Bearer " + token };
  const response = await fetch(path, opts);
  if (response.status === 401) {
    const error = new Error(token ? "wrong password" : "password needed");
    error.locked = true;
    throw error;
  }
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch (_) { /* not JSON */ }
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return response.json();
}

function euro(amount) {
  return amount == null ? "" : amount.toFixed(2).replace(".", ",") + " €";
}

function badge(saidBy) {
  if (saidBy === "you") return el("span", { class: "badge you" }, "you");
  if (saidBy === "app") return el("span", { class: "badge app" }, "app");
  return el("span", { class: "badge none" }, "not placed");
}

// Everything the app claims a thing is, in one line: "Magnesium · Doppelherz
// · system, 400 mg, Citrat · 20 pcs". What it is, who made it, every other
// detail the pack says, then how it was sold. All of it, so that "Right" on a
// spot check judges the whole answer, not half of it (Parham, 2026-10-08).
function productText(name, brand, more) {
  const { details, sold_as: soldAs } = more || {};
  return [name, brand, (details || []).join(", "), sizeText(soldAs)].filter(Boolean)
    .join(" · ");
}

function sizeText(soldAs) {
  if (!soldAs) return "";
  if (soldAs.form === "loose") return "loose";
  const size = soldAs.size;
  if (!size || size.value == null) return "";
  const unit = size.unit === "piece" ? "pcs" : size.unit || "";
  const amount = `${String(size.value).replace(".", ",")} ${unit}`.trim();
  return size.count > 1 ? `${size.count} × ${amount}` : amount;
}

// --- answering ------------------------------------------------------------

async function answer(receiptId, position, body) {
  try {
    const doc = await api(`/v1/receipts/${receiptId}/lines/${position}/resolution`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    // Say what it was stored as: a description is read into the app's format.
    const line = (doc.lines || []).find(l => l.position === position);
    if (body.product_id === null) toast("Answer taken back");
    else toast(line && line.product ? "Saved as: " + productText(line.product, line.brand, line)
                                     : "Saved",
               () => answer(receiptId, position, { product_id: null }));
    await load();
  } catch (error) {
    toast("Not saved: " + error.message);
  }
}

// One tap: leave a line out of my numbers (bought for someone else), or
// count it again. No reason asked. Reached by swiping the line left.
async function setCounted(receiptId, position, counted) {
  try {
    await api(`/v1/receipts/${receiptId}/lines/${position}/counted`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ counted }),
    });
    toast(counted ? "Counted again" : "Left out of your numbers; it stays on the receipt",
          () => setCounted(receiptId, position, !counted));
    await load();
  } catch (error) {
    toast("Not saved: " + error.message);
  }
}

// Search the catalog, or say what it was in your own words: any language, as
// loose as you like. The server reads a description into its own format.
function picker(receiptId, position, extra) {
  const results = el("div", { class: "list" });
  const search = el("input", { placeholder: "What was it? Search, or describe it",
                               autocomplete: "off" });
  const create = el("button", { onclick: () => {
    const description = search.value.trim();
    if (!description) return;
    create.disabled = true;
    create.textContent = "Reading your description…";
    answer(receiptId, position, { new_product: { description } });
  } }, "None of these: save my description");
  let timer;
  search.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const q = search.value.trim();
      if (!q) return results.replaceChildren();
      try {
        const found = await api("/v1/products?q=" + encodeURIComponent(q));
        // Swapped in one go: emptied first, the list collapsed and the page
        // jumped under the shopper's thumb.
        results.replaceChildren(...found.map(p => el("button", { onclick: () => answer(
          receiptId, position, { product_id: p.product_id }) },
          productText(p.name, p.brand, p),
          p.category_path ? el("div", { class: "meta" }, p.category_path.join(" › ")) : null)));
        if (!found.length) results.append(el("div", { class: "meta" }, "Nothing in the catalog."));
      } catch (error) { toast(error.message); }
    }, 250);
  });
  return el("div", { class: "picker" }, extra || null, search, results, create);
}

// --- views ----------------------------------------------------------------

function checkCard(check) {
  const card = el("div", { class: "card" });
  const wrong = el("button", { class: "bad", onclick: () => {
    wrong.disabled = true;
    card.append(picker(check.receipt_id, check.position));
  } }, "Wrong");
  card.append(
    el("div", { class: "meta" }, "Spot check · ", check.store || "", " · ", check.date || "",
       check.paid != null ? " · " + euro(check.paid) : ""),
    el("div", { class: "printed" }, check.raw_name),
    // A photo of the pack settles it at a glance (2026-10-08); a tap opens
    // the page it is from, to look closer.
    check.picture ? el("a", { class: "picture", href: check.picture.page || check.picture.url,
                              target: "_blank", rel: "noopener" },
      el("img", { src: check.picture.url, alt: "", loading: "lazy" }),
      el("span", { class: "meta" }, "Photo: ", check.picture.from)) : null,
    el("div", { class: "says" }, "The app says ", el("b", {}, productText(check.app_product,
       check.brand, check) || check.app_product_id),
       check.category_path ? el("div", { class: "meta" }, check.category_path.join(" › ")) : null),
    el("div", { class: "row" },
       el("button", { class: "good", onclick: () => answer(check.receipt_id, check.position,
         { product_id: check.app_product_id }) }, "Right"),
       wrong),
  );
  return card;
}

function questionCard(question) {
  const card = el("div", { class: "card" });
  const offered = el("div", { class: "list" }, question.candidates.map(c =>
    el("button", { onclick: () => answer(question.receipt_id, question.position,
      { candidate: c.number }) },
      productText(c.name, c.brand), c.pack_size ? el("span", { class: "meta" }, " " + c.pack_size)
      : null, question.model_pick === c.number ? el("span", { class: "badge app" }, "app's pick")
      : null)));
  const other = el("button", { onclick: () => {
    other.disabled = true;
    card.append(picker(question.receipt_id, question.position));
  } }, question.candidates.length ? "Something else" : "Say what it was");
  // Through el(), which skips missing parts: DOM append would print "null".
  card.append(el("div", {},
    el("div", { class: "meta" }, "Question · ", question.store || "", " · ",
       question.date || "", question.paid != null ? " · " + euro(question.paid) : ""),
    el("div", { class: "printed" }, question.raw_name),
    question.per_line ? el("div", { class: "why" },
      "The till prints this for anything: your answer is for this line only.") : null,
    question.unclear ? el("div", { class: "why" }, "The app can't tell: ", question.unclear)
      : el("div", { class: "why" }, "The app found no product it is sure of."),
    // What the search narrowed it to: one tap says it, in those words.
    question.choices && question.choices.length ? el("div", { class: "meta" },
      "A web search narrowed it to. Tap the one you bought:") : null,
    question.choices && question.choices.length ? el("div", { class: "list" },
      ...question.choices.map((choice) => el("button", { onclick: () => answer(
        question.receipt_id, question.position, { new_product: { description: choice } }) },
        choice))) : null,
    question.candidates.length ? el("div", { class: "meta" },
      "Shop products with similar names. Pick one only if it is what you bought:") : null,
    offered, el("div", { class: "row" }, other)));
  return card;
}

function waitingView() {
  const cards = [...state.checks.checks.map(checkCard),
                 ...state.questions.questions.map(questionCard)];
  if (!cards.length) return [el("div", { class: "empty" }, "Nothing is waiting for you.")];
  return cards;
}

// Open one receipt (never toggling it shut) with its lines as they are now.
async function showReceipt(receiptId) {
  state.open = receiptId;
  await refreshReceipt(receiptId);
}

async function refreshReceipt(receiptId) {
  try {
    const doc = await api(`/v1/receipts/${receiptId}`);
    state.receiptLines = { ...(state.receiptLines || {}), [receiptId]: doc.lines };
  } catch (error) { toast(error.message); }
  render();
}

async function openReceipt(receiptId) {
  state.open = state.open === receiptId ? null : receiptId;
  if (state.open !== null && !state.receiptLines?.[receiptId]) {
    try {
      const doc = await api(`/v1/receipts/${receiptId}`);
      state.receiptLines = { ...(state.receiptLines || {}), [receiptId]: doc.lines };
    } catch (error) { toast(error.message); state.open = null; }
  }
  render();
}

function receiptCard(summary) {
  const card = el("div", { class: "card" });
  card.append(el("div", { class: "line", onclick: () => openReceipt(summary.receipt_id) },
    el("div", {},
       el("div", { class: "what" }, summary.store || "Unknown shop"),
       el("div", { class: "meta" }, summary.date || "", " · ", summary.product_lines,
          " lines: ", summary.said_by_you, " you, ", summary.said_by_app, " app",
          summary.unplaced ? `, ${summary.unplaced} not placed` : "",
          summary.not_counted ? `, ${summary.not_counted} left out` : "")),
    el("div", { class: "money" }, euro(summary.printed_total))));
  if (state.open === summary.receipt_id) {
    if (inProgress().some(job => job.receipt_id === summary.receipt_id)) {
      card.append(el("div", { class: "why" },
        "First reading: the names in grey are guesses from the photo. The app is still " +
        "placing each line; this receipt updates by itself."));
    }
    const editing = state.editing === summary.receipt_id;
    card.classList.toggle("editing", editing);
    card.append(el("div", { class: "edit-row" },
      el("div", { class: "meta" }, "Swipe a line left to leave it out of your numbers"),
      el("button", { onclick: () => {
        state.editing = editing ? null : summary.receipt_id;
        render();
      } }, editing ? "Done" : "Edit")));
    for (const line of (state.receiptLines?.[summary.receipt_id] || [])) {
      if (line.type !== "product") continue;
      // A line nothing placed shows the photo reading's guess, marked as one.
      const guess = !line.product && line.first_guess;
      const what = line.product ? [productText(line.product, line.brand, line),
                                   badge(line.said_by)]
        : guess ? [el("span", { class: "guess" }, guess.name || line.raw_name),
                   el("span", { class: "badge guess" }, "guess")]
        : ["—", line.not_counted ? null : badge(line.said_by)];  // nothing left to place
      const counted = !line.not_counted;
      const act = el("button", { class: "act", onclick: () => {
        act.disabled = true;
        setCounted(summary.receipt_id, line.position, !counted);
      } }, counted ? "Leave out" : "Count again");
      const row = el("div", { class: counted ? "line" : "line off" },
        el("div", {},
           el("div", { class: "what" }, ...what,
              counted ? null : el("span", { class: "badge none" }, "left out")),
           guess && guess.category_path ? el("div", { class: "meta" },
             guess.category_path.slice(1).join(" › ")) : null,
           el("div", { class: "printed" }, line.raw_name)),
        el("div", { class: "money" }, euro(line.net_paid)));
      const wrap = el("div", { class: counted ? "swipe" : "swipe out" }, act, row);
      swipeable(wrap, row);
      row.addEventListener("click", () => {
        if (wrap.classList.contains("open") || editing) {  // a tap closes it, as on iOS
          wrap.classList.remove("open");
          return;
        }
        if (wrap.nextSibling?.classList?.contains("picker")) return;
        // A line answered here can be taken back, to what the app says without it.
        const takeBack = line.resolution === "user" ? el("button", { onclick: () =>
          answer(summary.receipt_id, line.position, { product_id: null }) },
          "Take back my answer") : null;
        wrap.after(picker(summary.receipt_id, line.position,
          el("div", {}, takeBack, el("div", { class: "meta" }, "Correct what this line is:"))));
      });
      card.append(wrap);
    }
  }
  return card;
}

// Follow a finger sideways on a line: past half the action's width it stays
// open, else it slides back. An up-and-down move is left to the page scroll.
const ACTION_WIDTH = 96;
function swipeable(wrap, row) {
  let start = null, moved = 0, sideways = false;
  row.addEventListener("touchstart", event => {
    const touch = event.touches[0];
    start = { x: touch.clientX, y: touch.clientY };
    moved = 0;
    sideways = false;
  }, { passive: true });
  row.addEventListener("touchmove", event => {
    if (!start) return;
    const dx = event.touches[0].clientX - start.x, dy = event.touches[0].clientY - start.y;
    if (!sideways && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) sideways = true;
    if (!sideways) return;
    const from = wrap.classList.contains("open") ? -ACTION_WIDTH : 0;
    moved = Math.min(0, Math.max(-ACTION_WIDTH, from + dx));
    row.style.transition = "none";
    row.style.transform = `translateX(${moved}px)`;
  }, { passive: true });
  row.addEventListener("touchend", () => {
    start = null;
    row.style.transition = "";
    row.style.transform = "";
    if (!sideways) return;
    for (const other of document.querySelectorAll(".swipe.open")) {
      if (other !== wrap) other.classList.remove("open");
    }
    wrap.classList.toggle("open", moved < -ACTION_WIDTH / 2);
  });
}

// --- adding a receipt -----------------------------------------------------

// Photos up, job ids back. What is still being read lives on the server
// (`GET /v1/jobs`), not in the browser that sent it, so a phone and a laptop
// show the same list (Parham, 2026-10-08) and a reload loses nothing. While
// something is in progress the page asks again every few seconds; when a job
// leaves the list its receipt is finished, and the history is loaded again.
const POLL_MS = 3000;
try { localStorage.removeItem("grocery-job"); } catch (_) { /* the old one-job memory */ }

function inProgress() {
  return (state.jobs || []).filter(job => job.status === "queued" || job.status === "running");
}

async function upload(files) {
  for (const file of files) {
    const sending = { name: file.name };
    state.sending.push(sending);
    render();
    try {
      const body = new FormData();
      body.append("file", file);
      const job = await api("/v1/receipts", { method: "POST", body });
      if (job.status === "done") toast("This photo is already in your receipts");
      else state.uploaded.add(job.job_id);
    } catch (error) {
      state.notSent.push({ name: file.name, error: error.message });
    }
    state.sending = state.sending.filter(item => item !== sending);
    await refreshJobs();
  }
}

// One at a time: an upload, the timer and a tab switch may all ask at once.
async function refreshJobs() {
  if (refreshJobs.busy) { refreshJobs.again = true; return; }
  refreshJobs.busy = true;
  try {
    await refreshJobsOnce();
  } finally {
    refreshJobs.busy = false;
    if (refreshJobs.again) { refreshJobs.again = false; refreshJobs(); }
  }
}

async function refreshJobsOnce() {
  clearTimeout(refreshJobs.timer);
  let doc;
  try {
    doc = await api("/v1/jobs");
  } catch (error) {
    if (!error.locked) toast(error.message);
    return;
  }
  const before = new Map((state.jobs || []).map(job => [job.job_id, job]));
  state.jobs = doc.jobs;
  const now = new Map(doc.jobs.map(job => [job.job_id, job]));
  // A job that left the list, failed, or got its receipt changes the history.
  const changed = [...before.values()].some(old => {
    const job = now.get(old.job_id);
    return !job || job.status !== old.status || job.receipt_id !== old.receipt_id;
  });
  // A receipt this browser sent opens as soon as it is read, if it is the
  // only one in progress and the shopper is still looking at the Add tab.
  const justRead = doc.jobs.find(job => job.receipt_id != null && state.uploaded.has(job.job_id)
    && before.get(job.job_id) && before.get(job.job_id).receipt_id == null);
  if (changed) await load({ jobs: false });
  if (justRead && justRead.already_added) toast("Already in your receipts");
  if (justRead && state.tab === "add" && inProgress().length <= 1) {
    state.tab = "receipts";
    await showReceipt(justRead.receipt_id);
  } else if (inProgress().some(job => job.receipt_id === state.open) && state.tab === "receipts") {
    await refreshReceipt(state.open);  // the lines placed so far
  } else if (changed || state.tab === "add") {
    render();  // only when it shows something new: a redraw loses a text selection
  }
  if (state.sending.length || inProgress().length) {
    refreshJobs.timer = setTimeout(refreshJobs, POLL_MS);
  }
}

function elapsed(since) {
  const seconds = Math.max(0, Math.round((Date.now() - since) / 1000));
  return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
}

function clock(iso) {
  const at = new Date(iso);
  return isNaN(at) ? "" : at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function jobCard(job) {
  const added = "Added " + clock(job.created_at);
  if (job.status === "failed") {
    return el("div", { class: "card" }, el("h2", {}, "Not read"),
      el("div", { class: "meta" }, added), el("div", { class: "why" }, job.error || ""));
  }
  const summary = (state.receipts || []).find(r => r.receipt_id === job.receipt_id);
  if (job.already_added) {
    return el("div", { class: "card" }, el("h2", {}, "Already added"),
      el("div", { class: "meta" }, [summary && summary.store, summary && summary.date, added]
        .filter(Boolean).join(" · ")),
      el("div", { class: "why" }, "This receipt is already in your history, so nothing new " +
        "was saved."),
      el("div", { class: "row" }, el("button", { onclick: () => {
        state.tab = "receipts";
        showReceipt(job.receipt_id);
      } }, "Open the receipt")));
  }
  const since = Date.parse(job.created_at) || Date.now();
  if (job.receipt_id == null) {
    return el("div", { class: "card" }, el("h2", {}, `Reading the photo… ${elapsed(since)}`),
      el("div", { class: "meta" }, added));
  }
  return el("div", { class: "card" },
    el("h2", {}, `Read. Placing the lines… ${elapsed(since)}`),
    el("div", { class: "meta" }, [summary && summary.store, summary && summary.date, added]
      .filter(Boolean).join(" · ")),
    el("div", { class: "row" }, el("button", { class: "primary", onclick: () => {
      state.tab = "receipts";
      showReceipt(job.receipt_id);
    } }, "Open the receipt")));
}

function addView() {
  const input = el("input", { type: "file", accept: "image/*", multiple: "" });
  input.addEventListener("change", () => upload([...input.files]));
  return [
    el("div", { class: "card" },
      el("label", { class: "photo" }, "Take or choose photos of receipts", input),
      el("div", { class: "why" },
        "The whole receipt, flat and in focus. You can add the next one while others are " +
        "read. Each receipt opens with a first guess per line, and the app places the " +
        "lines one by one; this list is the same on all your devices.")),
    ...state.sending.map(item => el("div", { class: "card" },
      el("h2", {}, "Sending the photo…"), el("div", { class: "meta" }, item.name))),
    ...state.notSent.map(item => el("div", { class: "card" },
      el("h2", {}, "Not sent"), el("div", { class: "meta" }, item.name),
      el("div", { class: "why" }, item.error))),
    ...(state.jobs || []).map(jobCard),
  ];
}

// --- insights -------------------------------------------------------------

// What happened last month? (Parham, 2026-10-09.) One month at a time: what
// the money went on, by part of the shop, and the products in each. Opens on
// last month when there are receipts from it, else on the newest month.
function monthName(month) {
  const [year, number] = month.split("-").map(Number);
  return new Date(year, number - 1, 1).toLocaleDateString("en-GB",
    { month: "long", year: "numeric" });
}

function defaultMonth(months) {
  const now = new Date();
  const last = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const key = `${last.getFullYear()}-${String(last.getMonth() + 1).padStart(2, "0")}`;
  return months.some(m => m.month === key) ? key : months[0].month;
}

function branchRow(branch, biggest) {
  const open = state.openBranch === branch.branch;
  const share = biggest ? branch.spend / biggest : 0;
  const row = el("div", { class: "spend-row", onclick: () => {
    state.openBranch = open ? undefined : branch.branch;
    render();
  } },
    el("div", { class: "line" },
      el("div", {}, el("div", { class: "what" }, branch.branch || "Not sorted yet"),
         el("div", { class: "meta" }, `${branch.lines} ${branch.lines === 1 ? "line" : "lines"}`,
            branch.branch ? "" : " with no category yet")),
      el("div", { class: "money" }, euro(branch.spend))),
    el("div", { class: "bar" }, el("i", { style: `width: ${Math.max(2, share * 100)}%` })));
  if (!open) return row;
  return el("div", {}, row, el("div", { class: "items" }, branch.items.map(item =>
    el("div", { class: "line" },
      el("div", { class: "what" }, productText(item.product, item.brand)),
      el("div", { class: "money" }, (item.lines > 1 ? `${item.lines}× · ` : "") +
         euro(item.spend))))));
}

function insightsView() {
  const d = state.insights;
  if (!d) return [el("div", { class: "empty" }, "Loading insights…")];
  if (!d.months.length) return [el("div", { class: "empty" }, "No receipts yet.")];
  if (!d.months.some(m => m.month === state.month)) state.month = defaultMonth(d.months);
  const month = d.months.find(m => m.month === state.month);
  const choose = el("div", { class: "months" }, [...d.months].reverse().map(m =>
    el("button", { class: m.month === state.month ? "on" : "", onclick: () => {
      state.month = m.month;
      state.openBranch = undefined;
      render();
    } }, monthName(m.month).replace(/ \d+$/, ""))));
  return [el("div", { class: "card" }, choose,
    el("h2", {}, monthName(month.month)),
    el("div", { class: "stat" }, euro(month.spend)),
    el("div", { class: "meta" }, `${month.receipts} ${month.receipts === 1 ? "receipt" : "receipts"}`,
       " · lines you left out are not counted"),
    el("div", { class: "spend" }, month.branches.map(b =>
      branchRow(b, Math.max(...month.branches.map(x => x.spend))))))];
}

function receiptsView() {
  if (!state.receipts.length) return [el("div", { class: "empty" }, "No receipts yet.")];
  return state.receipts.map(receiptCard);
}

function render() {
  for (const tab of TABS) {
    document.getElementById("tab-" + tab).className = state.tab === tab ? "on" : "";
  }
  const view = document.getElementById("view");
  if (!state.checks) return;
  // Never redraw under someone typing: it took the text box away mid-word and
  // jumped the page (2026-10-08). Drawn once they leave the box.
  if (view.contains(document.activeElement) && document.activeElement.tagName === "INPUT") {
    render.pending = true;
    return;
  }
  render.pending = false;
  const views = { waiting: waitingView, receipts: receiptsView, add: addView,
                  insights: insightsView };
  view.replaceChildren(...views[state.tab]());
  const m = state.checks.meta;
  const answered = m.right + m.corrected;
  document.getElementById("stats").textContent =
    `${m.open} spot checks and ${state.questions.meta.open} questions waiting · ` +
    (answered ? `app wrong on ${m.corrected} of ${answered} checked lines` :
                "no spot check answered yet");
}

async function load({ jobs = true } = {}) {
  try {
    const [checks, questions, receipts] = await Promise.all([
      // Only searched questions: the shopper sees none a search could have answered.
      api("/v1/checks"), api("/v1/questions?searched=true"), api("/v1/receipts")]);
    Object.assign(state, { checks, questions, receipts, receiptLines: {}, insights: null });
    // Insights are computed on request; fetched after the rest so they never hold it up.
    api("/v1/insights").then(doc => { state.insights = doc; if (state.tab === "insights") render(); })
      .catch(error => { if (state.tab === "insights") toast("Insights: " + error.message); });
    if (state.open !== null) {  // keep an open receipt open, with its new answers
      const doc = await api(`/v1/receipts/${state.open}`);
      state.receiptLines[state.open] = doc.lines;
    }
    render();
    if (jobs) refreshJobs();
  } catch (error) {
    if (error.locked) return askPassword(error.message);
    document.getElementById("stats").textContent = "Cannot load: " + error.message;
  }
}

function askPassword(why) {
  document.getElementById("stats").textContent = why === "wrong password"
    ? "That password is wrong." : "This server needs its password.";
  const field = el("input", { type: "password", autocomplete: "current-password",
                              placeholder: "Password", autocapitalize: "off",
                              autocorrect: "off", spellcheck: "false" });
  const unlock = () => {
    try { localStorage.setItem("grocery-token", field.value.trim()); } catch (_) { /* private mode */ }
    document.getElementById("stats").textContent = "Loading…";
    load();
  };
  field.addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
  document.getElementById("view").replaceChildren(
    el("div", { class: "card" }, field,
       el("div", { class: "row", style: "margin-top: 10px" },
          el("button", { class: "primary", onclick: unlock }, "Unlock"))));
  field.focus();
}

for (const tab of TABS) {
  document.getElementById("tab-" + tab).addEventListener("click", () => {
    state.tab = tab; render();
    if (tab === "add") refreshJobs();
  });
}
// A redraw held back while the shopper typed. Later, not at once: leaving the
// box by tapping a result must reach that button before it is redrawn away.
document.getElementById("view").addEventListener("focusout", () => {
  setTimeout(() => { if (render.pending) render(); }, 400);
});
// Back on the page: another device may have added a receipt meanwhile.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.checks) refreshJobs();
});
load();
</script>
</body>
</html>
