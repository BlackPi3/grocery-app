# Deploys main to Cloud Run once its tests have passed: merging a pull
# request is the deploy. Google is reached without a stored key (Workload
# Identity Federation, set up once by scripts/setup-deploy-from-github.sh),
# and only this repo's main is let in.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer merge waits rather than racing an older one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  GROCERY_PROJECT: project-cb9f2189-e79b-4351-bab

jobs:
  deploy:
    # Only a green ci run on a push to main (not a pull request's run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit ci tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/213623348067/locations/global/workloadIdentityPools/github/providers/grocery-app
          service_account: github-deployer@project-cb9f2189-e79b-4351-bab.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: scripts/deploy.sh
        env:
          # Sign in with Google: off while these are empty (scripts/deploy.sh).
          # The address is a secret so it stays out of the public logs.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GROCERY_OWNER_EMAIL: ${{ secrets.GROCERY_OWNER_EMAIL }}
          # Who runs the server, named on the privacy page.
          GROCERY_OWNER_NAME: ${{ vars.GROCERY_OWNER_NAME }}
      - name: The new server and the demo answer
        run: |
          for service in grocery grocery-demo; do
            url=$(gcloud run services describe "$service" --project "$GROCERY_PROJECT" \
                  --region europe-west3 --format='value(status.url)')
            curl --fail --silent --show-error "$url/health"
          done
