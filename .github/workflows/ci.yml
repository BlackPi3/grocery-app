# Every push and pull request: lint, then the test suite, on the Python
# versions the package claims to support. Main is protected by these checks.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grocery
          POSTGRES_PASSWORD: grocery
          POSTGRES_DB: grocery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grocery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://grocery:grocery@localhost:5432/grocery_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,api]"
      - run: ruff check src tests
      - run: pytest -q
